<style>
/* ---------- Tokens: Lydia's palette ---------- */
:root {
  --bg: #FFFFFF;
  --bg-soft: #FBF7F7;          /* faint burgundy-tinted white for panels */
  --card: #FFFFFF;
  --accent: #660019;           /* burgundy */
  --accent-light: #800020;
  --accent-wash: rgba(102, 0, 25, 0.07);
  --mauve: #928287;
  --black: #111111;
  --text: #222222;
  --border: #800020;
  --hairline: rgba(128, 0, 32, 0.22);
  --on-accent: #FFFFFF;
  --nav-bg: rgba(255, 255, 255, 0.9);
  --shadow: 0 18px 40px -24px rgba(17, 17, 17, 0.25);
  --serif: 'DM Serif Display', Georgia, 'Times New Roman', serif;
  --sans: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'DM Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --gutter: clamp(16px, 5vw, 3rem);
  --nav-h: 66px;               /* updated from the real nav height by app.js */
  --footer-h: 90px;
  --arrow: var(--mauve);
  --underline: #EAE4E5;         /* faint mauve: marks nav items as links */
  color-scheme: light;
}

/* Dark version of the same palette: burgundy and mauve lifted for contrast */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #140D0F; --bg-soft: #1B1215; --card: #1E1417;
    --accent: #D46A7E; --accent-light: #E0859A; --accent-wash: rgba(212, 106, 126, 0.12);
    --mauve: #B8A9AE; --black: #F5EEEF; --text: #E2D8DA;
    --border: #7A3040; --hairline: rgba(212, 106, 126, 0.26); --on-accent: #140D0F; --nav-bg: rgba(20, 13, 15, 0.88);
    --shadow: 0 18px 40px -24px rgba(0, 0, 0, 0.8);
    --underline: #3A2D31;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #140D0F; --bg-soft: #1B1215; --card: #1E1417;
  --accent: #D46A7E; --accent-light: #E0859A; --accent-wash: rgba(212, 106, 126, 0.12);
  --mauve: #B8A9AE; --black: #F5EEEF; --text: #E2D8DA;
  --border: #7A3040; --hairline: rgba(212, 106, 126, 0.26); --on-accent: #140D0F; --nav-bg: rgba(20, 13, 15, 0.88);
  --shadow: 0 18px 40px -24px rgba(0, 0, 0, 0.8);
  --underline: #3A2D31;
  color-scheme: dark;
}

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.6;
  background: var(--bg);
  color: var(--text);
  overflow-x: hidden;
  transition: background-color .3s, color .3s;
}
h1, h2, h3, h4, p, ul, figure { margin: 0; }
ul { padding: 0; list-style: none; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
svg { flex-shrink: 0; }

section { padding: clamp(4rem, 9vw, 7rem) var(--gutter); max-width: 1240px; margin-inline: auto; }
.section-label {
  display: flex; align-items: center; gap: 12px;
  font-size: .72rem; font-weight: 600; letter-spacing: .18em; text-transform: uppercase;
  color: var(--mauve); margin-bottom: 1rem;
}
.section-label::before { content: ''; width: 28px; height: 1px; background: var(--accent); }
.section-label.center { justify-content: center; }

/* One section per screen: each lands just below the nav and fills the view */
main > section:not(.hero) {
  padding-top: clamp(2rem, 4vw, 3rem);
  min-height: calc(100svh - var(--nav-h));
  scroll-margin-top: var(--nav-h);
}
main > section:last-child { min-height: calc(100svh - var(--nav-h) - var(--footer-h)); }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; }
.section-head .section-label { margin-bottom: 0; }
.section-head.center { display: grid; grid-template-columns: 1fr auto 1fr; align-self: stretch; }
.section-head.center .section-label { grid-column: 2; }
.section-head.center .sec-nav { grid-column: 3; justify-self: end; }

/* Section arrows */
.sec-nav { display: flex; gap: 6px; }
.sec-arrow { display: inline-flex; width: 28px; height: 28px; color: var(--arrow); border-radius: 7px; opacity: .8; transition: color .2s, opacity .2s, transform .2s; }
.sec-arrow svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.sec-arrow:hover { color: var(--accent); opacity: 1; transform: translateY(-1px); }
h2 {
  font-family: var(--serif); font-weight: 400;
  font-size: clamp(2rem, 4.2vw, 3rem); line-height: 1.1;
  color: var(--black); text-wrap: balance;
}
h2 em, h1 em { color: var(--accent); }
.label { font-size: .7rem; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--mauve); }

/* ---------- Nav ---------- */
.nav {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50;
  display: flex; align-items: center; justify-content: space-between; gap: 1rem;
  padding: .85rem var(--gutter);
  background: var(--nav-bg);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--hairline);
}
.nav-logo { font-family: var(--serif); font-size: 1.2rem; color: var(--accent); white-space: nowrap; }
.nav-logo, .nav-links a {
  text-decoration: underline; text-decoration-color: var(--underline);
  text-decoration-thickness: 1px; text-underline-offset: 3px; transition: color .2s, text-decoration-color .2s;
}
.nav-logo:hover, .nav-links a:hover { text-decoration-color: currentColor; }
.nav-right { display: flex; align-items: center; gap: 1.25rem; }
.nav-links { display: flex; gap: 1.75rem; }
.nav-links a {
  font-size: .76rem; font-weight: 500; letter-spacing: .12em; text-transform: uppercase;
  color: var(--black);
}
.nav-links a:hover { color: var(--accent); }
.icon-btn {
  width: 38px; height: 38px; display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid var(--hairline); border-radius: 8px; background: transparent;
  color: var(--black); cursor: pointer; transition: border-color .2s, color .2s;
}
.icon-btn:hover { border-color: var(--accent); color: var(--accent); }
.icon-btn svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
.i-moon { display: none; }
:root[data-dark] .i-sun { display: none; }
:root[data-dark] .i-moon { display: block; }

.nav-toggle { display: none; }
.nav-toggle span, .nav-toggle span::before, .nav-toggle span::after {
  display: block; width: 16px; height: 2px; background: currentColor; position: relative; transition: transform .2s, background .2s;
}
.nav-toggle span::before, .nav-toggle span::after { content: ''; position: absolute; left: 0; }
.nav-toggle span::before { top: -5px; }
.nav-toggle span::after { top: 5px; }
.nav-toggle[aria-expanded="true"] span { background: transparent; }
.nav-toggle[aria-expanded="true"] span::before { top: 0; transform: rotate(45deg); }
.nav-toggle[aria-expanded="true"] span::after { top: 0; transform: rotate(-45deg); }

/* ---------- Buttons & tags ---------- */
.cta-row { display: flex; flex-wrap: wrap; gap: .75rem; }
.cta-row.center { justify-content: center; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 13px 24px; border-radius: 4px; font: 600 .86rem/1 var(--sans); letter-spacing: .03em;
  text-decoration: none; cursor: pointer; transition: background .2s, border-color .2s, color .2s, transform .15s;
  max-width: 100%;
}
.btn svg { width: 15px; height: 15px; }
.btn-primary { background: var(--accent); color: var(--on-accent); border: 1px solid var(--accent); }
.btn-primary:hover { background: var(--accent-light); transform: translateY(-1px); }
.btn-primary.copied { background: var(--black); border-color: var(--black); color: var(--bg); }
.btn-ghost { background: transparent; color: var(--mauve); border: 1px solid var(--border); font-weight: 500; }
.btn-ghost:hover { color: var(--accent); border-color: var(--accent); }
.btn span { overflow-wrap: anywhere; }

.tags { display: flex; flex-wrap: wrap; gap: 8px; }
.tag {
  padding: 6px 14px; border: 1px solid var(--border); border-radius: 100px;
  font-size: .75rem; font-weight: 500; letter-spacing: .03em; color: var(--mauve); background: var(--card);
}

/* ---------- Hero ---------- */
.hero {
  display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr);
  gap: clamp(2rem, 5vw, 4.5rem); align-items: center;
  padding-top: clamp(3rem, 7vw, 5.5rem);
  position: relative; min-height: calc(100svh - var(--nav-h));
}
.hero-copy { display: flex; flex-direction: column; gap: 1.75rem; }
.hero h1 {
  font-family: var(--serif); font-weight: 400;
  font-size: clamp(3rem, 7.2vw, 5.6rem); line-height: 1.02; letter-spacing: -.01em;
  color: var(--black); text-wrap: balance;
}
.hero-industries { font-size: .95rem; line-height: 1.6; color: var(--mauve); max-width: 34em; margin-top: 12px; }
.hero-summary { font-size: 1.08rem; line-height: 1.75; font-weight: 300; color: var(--text); max-width: 34em; }

.hero-copy > * { animation: rise .7s cubic-bezier(.2,.7,.2,1) both; }
.hero-copy > *:nth-child(2) { animation-delay: .1s; }
.hero-copy > *:nth-child(3) { animation-delay: .18s; }
.hero-copy > *:nth-child(4) { animation-delay: .26s; }
@keyframes rise { from { opacity: .001; transform: translateY(14px); } }

/* Systems map */
.map {
  border: 1px solid var(--hairline); border-radius: 14px; overflow: hidden;
  background:
    radial-gradient(circle at 1px 1px, var(--hairline) 1px, transparent 1.5px) 0 0 / 22px 22px,
    var(--bg-soft);
  box-shadow: var(--shadow);
}
.map-head { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; padding: 1rem 1.25rem 0; flex-wrap: wrap; }
#systemsMap { display: block; width: 100%; height: auto; }
#systemsMap .edge { stroke: var(--border); stroke-width: 1.2; opacity: .45; transition: opacity .25s, stroke-width .25s; }
#systemsMap .edge.spoke { stroke-dasharray: 3 5; opacity: .35; }
#systemsMap .edge.on { opacity: 1; stroke-width: 2; stroke: var(--accent); }
#systemsMap .packet { fill: var(--accent); }
#systemsMap .node circle { fill: var(--card); stroke: var(--border); stroke-width: 1.3; transition: fill .2s, stroke .2s, r .2s; }
#systemsMap .node text { fill: var(--black); font: 500 12.5px var(--sans); text-anchor: middle; pointer-events: none; transition: fill .2s; }
#systemsMap .node.on circle { fill: var(--accent); stroke: var(--accent); }
#systemsMap .node.on text { fill: var(--on-accent); }
#systemsMap .node.dim { opacity: .45; }
#systemsMap .hub circle { fill: var(--accent); }
#systemsMap .hub .photo-ring { fill: none; stroke: var(--card); stroke-width: 4; }
#systemsMap .hub .photo-edge { fill: none; stroke: var(--accent); stroke-width: 1.5; }
#systemsMap .hub .ring { fill: none; stroke: var(--accent); opacity: .35; }
#systemsMap .hub text { fill: var(--on-accent); font: 400 17px var(--serif); text-anchor: middle; }

/* ---------- About ---------- */
.about-grid { display: grid; grid-template-columns: minmax(0, .65fr) minmax(0, 1.35fr); gap: clamp(2.5rem, 6vw, 5rem); margin-top: 3rem; align-items: start; }
.about-main { display: grid; gap: 2.5rem; }
.portrait { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 90px); width: 100%; max-width: 300px; justify-self: center; }
.portrait-frame { position: relative; }
.portrait-frame::before {
  content: ''; position: absolute; inset: 14px -14px -14px 14px; border: 1px solid var(--accent); border-radius: 14px; pointer-events: none;
}
.portrait img {
  position: relative; display: block; width: 100%; max-width: 100%; height: auto; aspect-ratio: 720 / 846; object-fit: cover;
  border-radius: 14px; background: var(--bg-soft);
}
.portrait figcaption { position: relative; margin-top: 2.2rem; font-size: .8rem; color: var(--mauve); letter-spacing: .02em; }
.portrait figcaption strong { color: var(--black); font-family: var(--serif); font-weight: 400; font-size: 1.15rem; display: block; }
.about-text { display: flex; flex-direction: column; gap: 1.2rem; max-width: 36em; }
.about-text p { font-size: 1rem; line-height: 1.85; font-weight: 300; }
.about-text strong { color: var(--black); font-weight: 600; }

/* ---------- Expertise ---------- */
.expertise-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.1rem; margin-top: 3rem; }
.card {
  --mx: 50%; --my: 0%;
  position: relative; display: flex; flex-direction: column; gap: .7rem;
  padding: 1.75rem; border-radius: 12px; border: 1px solid var(--hairline);
  background: radial-gradient(420px circle at var(--mx) var(--my), var(--accent-wash), transparent 60%), var(--card);
  transition: border-color .25s, transform .25s;
}
.card:hover { border-color: var(--accent); transform: translateY(-3px); }
.card h3 { font-size: 1rem; font-weight: 600; color: var(--accent); }
.card p { font-size: .88rem; color: var(--black); line-height: 1.65; flex: 1; }

/* Expertise disco balls */
#expertiseGrid { row-gap: 1.75rem; justify-items: center; }
.disco {
  --disco-glow: 255, 255, 255;
  position: relative; width: 100%; max-width: 263px; aspect-ratio: 1 / 1;
  display: flex; align-items: center; justify-content: center; text-align: center;
}
.disco canvas { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .72; pointer-events: none; }
.disco::before {
  content: ""; position: absolute; inset: 8%; border-radius: 50%; pointer-events: none; z-index: 1;
  background: radial-gradient(circle, rgba(var(--disco-glow), .78) 0%, rgba(var(--disco-glow), .55) 50%, rgba(var(--disco-glow), 0) 72%);
}
.disco-copy { position: relative; z-index: 2; max-width: 76%; display: flex; flex-direction: column; gap: .5rem; }
.disco h3 { font-size: .94rem; font-weight: 600; color: var(--accent); text-wrap: balance; }
.disco p { font-size: .79rem; font-weight: 600; line-height: 1.5; color: var(--black); text-wrap: pretty; }
:root[data-dark] .disco { --disco-glow: 20, 13, 15; }
:root[data-dark] .disco canvas { opacity: .5; }

/* ---------- Projects ---------- */
.project-link {
  color: var(--accent); text-decoration: underline; text-decoration-thickness: 1px;
  text-underline-offset: 4px; text-decoration-color: currentColor; transition: color .2s;
}
a.project-link:hover { color: var(--accent-light); }
.project-link.is-soon { cursor: default; }
.project-soon { align-self: flex-start; font-size: .7rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--mauve); }

.project-page {
  display: flex; flex-direction: column; align-items: flex-start; gap: 1.25rem;
  max-width: calc(50rem + 2 * var(--gutter));  /* one centered reading column */
}
.project-page .section-head { align-self: stretch; }
.project-title {
  font-family: var(--serif); font-weight: 400; font-size: clamp(2.4rem, 6vw, 4rem); line-height: 1.05;
  color: var(--black); margin-top: 1.5rem;
}
.project-title em { color: var(--accent); }
.project-note { font-weight: 300; line-height: 1.8; max-width: 32em; }

/* Case study on a project page */
.case { display: flex; flex-direction: column; gap: 2.75rem; width: 100%; margin: 1.5rem 0 1rem; }
.case-block { min-width: 0; }
.case-block h2 {
  font-family: var(--sans); font-size: .75rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
  color: var(--accent); margin-bottom: 1rem;
}
.case-block p, .case-block li { font-weight: 300; line-height: 1.8; color: var(--text); }
.case-block strong { font-weight: 600; color: var(--black); }
.case-block ul, .case-steps { padding: 0; margin: 0; }
.case-block ul { list-style: none; display: flex; flex-direction: column; gap: .7rem; }
.case-block ul li { position: relative; padding-left: 1.4rem; }
.case-block ul li::before {
  content: ''; position: absolute; left: .1rem; top: .75em; width: .38rem; height: .38rem; border-radius: 50%; background: var(--accent);
}
.case-note { font-size: .88rem; color: var(--mauve); }
.case-note a { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
.case-sample { display: flex; flex-direction: column; gap: 1rem; }
.case-sample h2 { margin-bottom: 0; }
.case-image {
  display: block; border-radius: 12px; overflow: hidden; line-height: 0;
  border: 1px solid var(--hairline); box-shadow: var(--shadow); transition: transform .25s, border-color .25s;
}
.case-image:hover { transform: translateY(-3px); border-color: var(--accent); }
.case-image img { display: block; width: 100%; height: auto; }
.case-sheet {
  width: 100%; height: 560px; border: 1px solid var(--hairline); border-radius: 12px; background: #FFFFFF;
}
.snippet {
  --sn-bg: #1C1316; --sn-bar: #241A1D; --sn-line: #3A2D31; --sn-text: #E9E0E2; --sn-dim: #8E7E83;
  --sn-key: #E58FA2; --sn-fn: #E3B77F; --sn-str: #A9CF9A; --sn-num: #C7A3E0;
  position: relative; border-radius: 12px; overflow: hidden; background: var(--sn-bg);
  border: 1px solid var(--sn-line); box-shadow: var(--shadow); min-width: 0;
}
.snippet-bar {
  display: flex; align-items: center; gap: .9rem; padding: .65rem .9rem;
  background: var(--sn-bar); border-bottom: 1px solid var(--sn-line);
}
.snippet-dots { display: inline-flex; gap: .4rem; }
.snippet-dots i { width: .62rem; height: .62rem; border-radius: 50%; background: var(--sn-line); }
.snippet-name { flex: 1; font-family: var(--mono); font-size: .76rem; color: var(--sn-dim); }
.snippet-toggle {
  font: 500 .74rem var(--sans); letter-spacing: .04em; color: var(--sn-text); cursor: pointer;
  background: transparent; border: 1px solid var(--sn-line); border-radius: 6px; padding: .3rem .7rem;
  transition: border-color .2s, color .2s;
}
.snippet-toggle:hover { border-color: var(--sn-key); color: var(--sn-key); }
.snippet-code {
  margin: 0; padding: 1rem 0; overflow-x: auto; counter-reset: ln;
  font-family: var(--mono); font-size: .78rem; line-height: 1.65; color: var(--sn-text); tab-size: 4;
}
.snippet-code.is-collapsed { max-height: 22em; overflow-y: hidden; }
.snippet-code .ln { display: block; padding: 0 1.1rem 0 0; white-space: pre; }
.snippet-code .ln::before {
  counter-increment: ln; content: counter(ln); display: inline-block; width: 3.2em; padding-right: 1.1em;
  text-align: right; color: var(--sn-dim); opacity: .6; user-select: none;
}
.snippet-toggle { display: block; width: calc(100% - 1.8rem); margin: 0 .9rem .9rem; padding: .55rem; }
.snippet:has(.is-collapsed) .snippet-toggle { position: relative; }
.snippet:has(.is-collapsed) .snippet-code { -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); }
.tk-k { color: var(--sn-key); }
.tk-f { color: var(--sn-fn); }
.tk-s { color: var(--sn-str); }
.tk-n { color: var(--sn-num); }
.tk-c { color: var(--sn-dim); font-style: italic; }
.case-steps { list-style: none; counter-reset: step; display: flex; flex-direction: column; gap: 1.25rem; }
.case-steps li { counter-increment: step; position: relative; padding-left: 2.6rem; }
.case-steps li::before {
  content: counter(step, decimal-leading-zero); position: absolute; left: 0; top: .1em;
  font-family: var(--mono); font-size: .8rem; color: var(--accent);
}

/* ---------- Recommendations ---------- */
.rec-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.1rem; margin-top: 2.5rem; }
.rec {
  display: flex; flex-direction: column; gap: 1.1rem;
  padding: 1.75rem; border-radius: 12px; border: 1px solid var(--hairline); background: var(--card);
  transition: border-color .25s;
}
.rec:hover { border-color: var(--accent); }
.rec-quote {
  position: relative; margin: 0; padding-top: 1.6rem;
  font-family: var(--serif); font-size: clamp(1.2rem, 1.9vw, 1.45rem); line-height: 1.35; color: var(--black);
}
.rec-quote::before {
  content: '\201C'; position: absolute; top: -.35rem; left: -.1rem;
  font-size: 3rem; line-height: 1; color: var(--accent);
}
.rec-full summary {
  cursor: pointer; width: fit-content; font-size: .76rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
  color: var(--mauve); list-style: none; transition: color .2s;
}
.rec-full summary::-webkit-details-marker { display: none; }
.rec-full summary::after { content: ' +'; }
.rec-full[open] summary::after { content: ' \2212'; }
.rec-full summary:hover { color: var(--accent); }
.rec-full p { margin-top: .8rem; font-size: .88rem; line-height: 1.7; color: var(--black); }
.rec-by { display: flex; align-items: center; gap: .8rem; padding-top: 1.1rem; border-top: 1px solid var(--hairline); margin-top: auto; }
.rec-avatar {
  flex: none; width: 40px; height: 40px; border-radius: 50%; object-fit: cover;
  box-shadow: 0 0 0 1px var(--hairline);
}
.rec-by strong { display: block; font-size: .92rem; font-weight: 600; color: var(--black); }
.rec-meta { display: block; font-size: .78rem; color: var(--mauve); line-height: 1.5; }
.rec-source { margin-top: 1.5rem; font-size: .8rem; color: var(--mauve); }
.rec-source a { color: var(--accent); text-underline-offset: 3px; }

/* ---------- Contact & footer ---------- */
.contact { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 1.1rem; }
.contact p { color: var(--text); max-width: 30em; font-weight: 300; line-height: 1.8; margin-bottom: 1rem; }
.footer {
  padding: 2rem var(--gutter); border-top: 1px solid var(--hairline);
  text-align: center; font-size: .78rem; letter-spacing: .04em; line-height: 1.6; color: var(--mauve); background: var(--bg);
  display: flex; flex-direction: column; gap: .35rem;
}
.footer a { color: var(--accent); text-underline-offset: 3px; }
/* LydiaCo logo */
.footer-logo { align-self: center; display: block; margin-top: .9rem; line-height: 0; border-radius: 12px; transition: transform .2s; }
.footer-logo img { display: block; width: 118px; height: 118px; border-radius: 12px; }
.footer-logo:hover { transform: translateY(-2px); }

/* ---------- Responsive ---------- */
/* Six menu items need room: collapse to the menu button below 1100px */
@media (max-width: 1100px) {
  .nav-toggle { display: inline-flex; }
  .nav-links {
    position: absolute; top: 100%; left: 0; right: 0; flex-direction: column; gap: 0;
    background: var(--bg); border-bottom: 1px solid var(--hairline);
    max-height: 0; overflow: hidden; transition: max-height .25s ease;
  }
  .nav-links.open { max-height: 400px; }
  .nav-links a { display: block; padding: 1rem var(--gutter); border-top: 1px solid var(--hairline); }
  .nav-right { gap: .5rem; }
}
@media (max-width: 960px) {
  .hero { grid-template-columns: 1fr; }
  .expertise-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 760px) {
  .about-grid { grid-template-columns: 1fr; }
  .portrait { position: relative; top: 0; max-width: 240px; justify-self: start; }
}
@media (max-width: 600px) {
  .expertise-grid { grid-template-columns: 1fr; }
  .rec-grid { grid-template-columns: 1fr; }
  .cta-row:not(.center) { flex-direction: column; align-items: stretch; }
  .contact .cta-row { flex-direction: column; align-items: stretch; width: 100%; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

#systemsMap .hub .ring { transform-box: fill-box; transform-origin: center; animation: pulse 3.2s ease-out infinite; }
@keyframes pulse { from { transform: scale(.75); opacity: .55; } to { transform: scale(1.6); opacity: 0; } }
</style>

 "paragraphs": ["For more than ten years, I have built my career at the intersection of business operations, data, and technology, earning **five promotions over eight years**. My experience spans retail, distilled spirits, payment processing, subscription billing, and social and clinical services.", "I began on the business side of eCommerce, where I was already solving problems, supporting users and tracking down platform issues. That work led me into QA for ONEHOPE Wine's commerce platform, where I traced issues to their root cause and learned not only how systems break, but why. That experience became the foundation for how I approach technical and operational problems.", "Most recently, as ACE's first Data Operations Manager II, I took on product, systems, and technical operations responsibilities while leading three Data Support Specialists and two engineering contractors supporting a newly migrated EHR platform across nine social and clinical service programs. I established formal scoping, strategic planning, and reporting, strengthened the team's technical capabilities, and resolved organizational gaps."]}, "platforms": [{"id": "ecom", "name": "eCommerce", "blurb": "Storefronts, catalogs, and order flow from cart to fulfillment.", "connectsTo": ["pay", "wms", "crm", "comp"]}, {"id": "pay", "name": "Fintech", "blurb": "Payment processing, subscription billing, and recurring revenue.", "connectsTo": ["ecom", "comp"]}, {"id": "wms", "name": "WMS", "blurb": "Warehouse management and inventory operations.", "connectsTo": ["ecom"]}, {"id": "ehr", "name": "EHR", "blurb": "Electronic health records with layered clinical and admin roles.", "connectsTo": ["comp"]}, {"id": "crm", "name": "CRM", "blurb": "Customer data, lifecycle workflows, and reporting.", "connectsTo": ["ecom"]}, {"id": "comp", "name": "Compliance", "blurb": "Audit trails, permissions, and regulatory controls, including compliance and distribution management software for distilled spirits.", "connectsTo": ["ecom", "pay", "ehr"]}], "expertise": [{"title": "Technical & Systems Operations", "body": "I own complex platforms end to end, from requirements through configuration to rollout. I catch failure points early and build systems that hold up as the business grows."}, {"title": "Product Ownership", "body": "I drive business requirements, stakeholder alignment, sprint planning, and delivery for a platform serving nine programs."}, {"title": "Business Strategy", "body": "I find operational inefficiencies, size the opportunity, and build the business case for change."}, {"title": "Data & Reporting Infrastructure", "body": "I design reporting pipelines, protect data integrity, and give teams the visibility to make good decisions quickly."}, {"title": "End-User Experience", "body": "Users aren't a footnote. I bring their perspective into every operational and product decision, especially in multi-role environments."}, {"title": "People Leadership", "body": "I listen first, collaborate openly, and build morale that lasts. Strong teams keep delivering long after a single project ends."}], "projects": {"title": "Problems I've", "titleEmphasis": "solved.", "items": [{"title": "Closing the Compliance Gap on Client Assessments", "summary": "No program owned the organization's main client assessment. I audited the data, defined ownership, and automated compliance reports for 7 programs, raising completion from under 50% to 90%.", "url": "/projects/compliance-reporting/"}, {"title": "Creating Cross-Program Visibility for a New Department", "summary": "My team had no shared view of its work across 9 programs. I built a central project board, introduced sprint planning, and automated intake. We delivered 773 stories in 2025.", "url": "/projects/cross-program-visibility/"}, {"title": "Project 3", "summary": "Coming Soon", "url": "/projects/coming-soon-3/"}]}, "recommendations": {"title": "In their", "titleEmphasis": "words.", "source": "Source: recommendations on my LinkedIn pro ideas for improvement impacted more than just the tech team.", "paragraphs": ["Lydia was a cornerstone of the tech team. She mastered the product inside out to where she would identify very obscure edge cases and solve very complex bugs. Her communication and tickets are so clear and descriptive that she saved us precious engineering time– and oftentimes she had already found the root cause of difficult issues that otherwise would have taken an engineer a lot of time to debug.", "Beyond Lydia's testing prowess, she has consistently taken initiative and juggled many tasks and demands beyond her defined role. Her thoughtful ideas for improvement impacted more than just the tech team. Her proactive approach, coupled with a collaborative and kind demeanor, made her a pleasure to work with.", "All to say, Lydia's thorough QA work significantly enhanced the quality and stability of their releases. Her ambition and attitude make her an invaluable asset. She will excel in any role she takes on, and I would be honored to work with Lydia again!"]}, {"name": "Matt Middlesworth", "photo": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/6xaJSlACEQAAAAEAABZ/anVtYgAAAB5qdW1kYzJwYQARABCAAACqADibcQNjMnBhAAAAFllqdW1iAAAAR2p1bWRjMm1hABEAEIAAAKoAOJtxA3VybjpjMnBhOjI2ODA3NjFjLTE1YmYtNDRlNi05MWVjLTI2NDFlMmJiYzM3ZAAAAAOUanVtYgAAAClqdW1kYzJhcwARABCAAACqADibcQNjMnBhLmFzc2VydGlvbnMAAAAAuWp1bWIAAABEanVtZGNib3IAEQAQgAAAqgA4m3ETYzJwYS5pbmdyZWRpZW50LnYzAAAAABhjMnNov0TBKkKTmmanP3B0rMTxnwAAAG1jYm9yo2lkYzpmb3JtYXRqaW1hZ2UvanBlZ2ppbnN0YW5jZUlEeCx4bXA6aWlkOmI1OTYzZTZiLTFlZWQtNDlhZC1iMWQ5LTBmY2ZkM2VkOGM5Y2xyZWxhdGlvbnNoaXBocGFyZW50T2YAAAHianVtYgAAAEFqdW1kY2JvcgARABCAAACqADibcRNjMnBhLmFjdGlvbnMudjIAAAAAGGMyc2ggU6pNBg87sjnZN2J5qS3QAAABmWNib3KiZ2FjdGlvbnOComZhY3Rpb25rYzJwYS5vcGVuZWRqcGFyYW1ldGVyc6FraW5ncmVkaWVudHOBomN1cmx4LXNlbGYjanVtYmY9YzJwYS5hc3NlcnRpb25zL2MycGEuaW5ncmVkaWVudC52M2RoYXNoWCAW4BnNuzkdpjw8EYRNnm8lUFLo9fSYhRU990OT0Y59RKRmYWN0aW9ueB1jb20uYW50aHJvcGljLmNsYXVkZS5wcm92aWRlZGpwYXJhbWV0ZXJzoX     gear: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"/>',
    target: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
    users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.2A6.5 6.5 0 0 1 21.5 20"/>',
    flag: '<path d="M5 21V4"/><path d="M5 4h12l-2 4 2 4H5"/>',
    layers: '<path d="m12 3 9 5-9 5-9-5 9-5z"/><path d="m3 13 9 5 9-5"/>',
    box: '<path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5v-9z"/><path d="M3 7.5 12 12l9-4.5M12 12v9"/>',
    compass: '<circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5 5-2z"/>',
    link: '<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
    chart: '<path d="M4 20V4M4 20h16"/><path d="M8 16v-4M12 16V8M16 16v-6"/>',
    eye: '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
    mail: '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>',
    linkedin: '<path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/>',
    github: '<path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/>',
  };
  const icon = (name) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[name] || ''}</svg>`;

  // ---------- GraphQL ----------
  async function gql(query, variables) {
    const t0 = performance.now();
    const res = await fetch(ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query, variables }),
    });
    if (!res.ok) throw new Error(`Server returned ${res.status}`);
    const json = await res.json();
    if (json.errors) throw new Error(json.errors.map((e) => e.message).join('; '));
    return { data: json.data, ms: Math.round(performance.now() - t0) };
  }

  // ---------- Theme ----------
  const root = document.documentElement;
  const media = matchMedia('(prefers-color-scheme: dark)');
  const isDark = () => root.dataset.theme ? root.dataset.theme === 'dark' : media.matches;
  const syncThemeIcon = () => { if (isDark()) root.setAttribute('data-dark', ''); else root.removeAttribute('data-dark'); };
  try { const saved = localStorage.getItem('lc-theme'); if (saved) root.dataset.theme = saved; } catch (e) { /* storage unavailable */ }
  syncThemeIcon();
  media.addEventListener('change', syncThemeIcon);
  new MutationObserver(syncThemeIcon).observe(root, { attributes: true, attributeFilter: ['data-theme'] });
  $('#themeToggle').addEventListener('click', () => {
    const next = isDark() ? 'light' : 'dark';
    root.dataset.theme = next;
    try { localStorage.setItem('lc-theme', next); } catch (e) { /* ignore */ }
  });

  // ---------- Keep section sizing in step with the real nav/footer height ----------
  const sizeVars = () => {
    root.style.setProperty('--nav-h', `${$('.nav').offsetHeight}px`);
    root.style.setProperty('--footer-h', `${$('.footer').offsetHeight}px`);
  };
  sizeVars();
  addEventListener('resize', sizeVars);

  // ---------- Section arrows that go back to the profile ----------
  document.addEventListener('click', (e) => {
    const a = e.target.closest('[data-top]');
    if (!a) return;
    e.preventDefault();
    window.scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' });
    history.replaceState(null, '', location.pathname + location.search);
  });

  // ---------- Logo: back to top ----------
  $('.nav-logo').addEventListener('click', (e) => {
    e.preventDefault();
    window.scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' });
    history.replaceState(null, '', location.pathname + location.search);
  });

  // ---------- Mobile nav ----------
  const navToggle = $('#navToggle'), navLinks = $('#navLinks');
  navToggle.addEventListener('click', () => {
    const open = navLinks.classList.toggle('open');
    navToggle.setAttribute('aria-expanded', String(open));
  });
  navLinks.addEventListener('click', (e) => {
    if (e.target.closest('a')) { navLinks.classList.remove('open'); navToggle.setAttribute('aria-expanded', 'false'); }
  });

  // ---------- Render ----------
  let DATA = null;
  const bind = (key, value) => document.querySelectorAll(`[data-bind="${key}"]`).forEach((el) => { el.textContent = value; });

  function ctaButtons(profile) {
    const email = `<button type="button" class="btn btn-primary" data-copy="${esc(profile.email)}">${icon('mail')}<span>${esc(profile.email)}</span></button>`;
    const links = profile.links.map((l) =>
      `<a class="btn btn-ghost" href="${esc(l.url)}" target="_blank" rel="noopener">${icon(l.kind)}${esc(l.label)}</a>`).join('');
    return email + links;
  }

  function render(d) {
    const p = d.profile;
    bind('name', p.name);
    bind('headlineLead', p.headlineLead);
    bind('headlineEmphasis', p.headlineEmphasis);
    bind('summary', p.summary);
    bind('industriesLine', p.industriesLine);
    bind('aboutTitle', d.about.title);
    bind('aboutEmphasis', d.about.titleEmphasis);
    bind('contactTitle', d.contact.title);
    bind('contactEmphasis', d.contact.titleEmphasis);
    bind('contactBody', d.contact.body);
    const f = d.footer;
    $('.footer').innerHTML = `<p>${esc(f.credit)} <a href="${esc(f.sourceUrl)}" target="_blank" rel="noopener">${esc(f.sourceLabel)}</a></p>
      <p>${esc(f.legal)}</p>
      <a class="footer-logo" href="/"><img src="/static/img/logo.png" alt="LydiaCo, Los Angeles" width="118" height="118"></a>`;

    $('#tags').innerHTML = p.tags.map((t) => `<li class="tag">${esc(t)}</li>`).join('');
    $('#heroCta').innerHTML = ctaButtons(p);
    $('#contactCta').innerHTML = ctaButtons(p);

    $('#portrait').innerHTML = `<div class="portrait-frame"><img src="${esc(p.photo.src)}" alt="${esc(p.photo.alt)}" width="720" height="846" loading="lazy"></div>
      <figcaption><strong>${esc(p.name)}</strong>${esc(d.tagline)}</figcaption>`;
    $('#aboutText').innerHTML = d.about.paragraphs.map((t) => `<p>${bold(t)}</p>`).join('');

    $('#expertiseGrid').innerHTML = d.expertise.map((e) => `
      <article class="disco">
        <canvas aria-hidden="true"></canvas>
        <div class="disco-copy">
          <h3>${esc(e.title)}</h3>
          <p>${esc(e.body)}</p>
        </div>
      </article>`).join('');
    startDisco();

    bind('projectsTitle', d.projects.title);
    bind('projectsEmphasis', d.projects.titleEmphasis);
    $('#projectGrid').innerHTML = d.projects.items.map((pr) => `
      <article class="card project">
        <h3>${pr.url
          ? `<a class="project-link" href="${esc(pr.url)}">${esc(pr.title)}</a>`
          : `<span class="project-link is-soon">${esc(pr.title)}</span>`}</h3>
        <p>${esc(pr.summary)}</p>
        ${pr.url ? '' : '<span class="project-soon">Coming soon</span>'}
      </article>`).join('');

    const rec = d.recommendations;
    bind('recTitle', rec.title);
    bind('recEmphasis', rec.titleEmphasis);
    $('#recGrid').innerHTML = rec.items.map((r) => `
      <article class="rec">
        <blockquote class="rec-quote">${esc(r.quote)}</blockquote>
        <details class="rec-full">
          <summary>Read full recommendation</summary>
          ${r.paragraphs.map((t) => `<p>${esc(t)}</p>`).join('')}
        </details>
        <footer class="rec-by">
          <img class="rec-avatar" src="${esc(r.photo)}" alt="" width="40" height="40" loading="lazy">
          <span><strong>${esc(r.name)}</strong><span class="rec-meta">${esc(r.title)}</span><span class="rec-meta">${esc(r.relationship)} · ${esc(r.date)}</span></span>
        </footer>
      </article>`).join('');
    $('#recSource').innerHTML = `${esc(rec.source)} <a href="${esc(rec.sourceUrl)}" target="_blank" rel="noopener">${esc(rec.sourceLabel)} <span aria-hidden="true">↗</span></a>`;

    buildMap(d.platforms);
  }

  // ---------- Copy email ----------
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-copy]');
    if (!btn) return;
    const text = btn.dataset.copy, span = btn.querySelector('span');
    const done = () => {
      btn.classList.add('copied'); span.textContent = 'Copied!';
      setTimeout(() => { btn.classList.remove('copied'); span.textContent = text; }, 1800);
    };
    const selectFallback = () => {
      const r = document.createRange(); r.selectNodeContents(span);
      const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    };
    try {
      navigator.clipboard.writeText(text).then(done, selectFallback);
    } catch (err) { selectFallback(); }
  });

  // ---------- Card spotlight ----------
  document.addEventListener('pointermove', (e) => {
    const card = e.target.closest && e.target.closest('.card');
    if (!card) return;
    const r = card.getBoundingClientRect();
    card.style.setProperty('--mx', `${e.clientX - r.left}px`);
    card.style.setProperty('--my', `${e.clientY - r.top}px`);
  });

  // ---------- Expertise disco balls ----------
  let discoRaf = 0;
  function startDisco() {
    cancelAnimationFrame(discoRaf);
    const canvases = [...document.querySelectorAll('#expertiseGrid .disco canvas')];
    const hash = (a, b, c) => { const s = Math.sin(a * 127.1 + b * 311.7 + c * 74.7) * 43758.5453; return s - Math.floor(s); };
    const norm = (v) => { const m = Math.hypot(...v); return v.map((x) => x / m); };
    const L = norm([-0.45, 0.6, 0.66]), H = norm([L[0], L[1], L[2] + 1]);
    const visible = new Set();
    const io = new IntersectionObserver((es) => es.forEach((en) => en.isIntersecting ? visible.add(en.target) : visible.delete(en.target)));
    canvases.forEach((c) => io.observe(c));

    function draw(c, rot, seed, t) {
      const dpr = window.devicePixelRatio || 1, w = c.clientWidth;
      if (!w) return;
      const size = Math.round(w * dpr);
      if (c.width !== size) c.width = c.height = size;
      const ctx = c.getContext('2d'), cx = size / 2, cy = size / 2, R = size * 0.495;
      const dark = root.hasAttribute('data-dark');
      ctx.clearRect(0, 0, size, size);
      const g = ctx.createRadialGradient(cx - R * 0.35, cy - R * 0.4, R * 0.1, cx, cy, R);
      g.addColorStop(0, dark ? '#6b4a55' : '#d9c4cb'); g.addColorStop(1, dark ? '#2a1a20' : '#8c6b76');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.fill();
      const P = (la, lo) => [cx + R * Math.cos(la) * Math.sin(lo), cy - R * Math.sin(la)];
      const bands = 18, glints = [];
      for (let b = 0; b < bands; b++) {
        const la0 = -Math.PI / 2 + b * Math.PI / bands, la1 = la0 + Math.PI / bands, lac = (la0 + la1) / 2;
        const n = Math.max(6, Math.round(36 * Math.cos(lac)));
        const dLa = (la1 - la0) * 0.07, step = Math.PI * 2 / n, dLo = step * 0.07;
        for (let k = 0; k < n; k++) {
          const lo0 = k * step + rot, lo1 = lo0 + step, loc = lo0 + step / 2;
          const nx = Math.cos(lac) * Math.sin(loc), ny = Math.sin(lac), nz = Math.cos(lac) * Math.cos(loc);
          if (nz < 0.01) continue;
          const rnd = hash(b, k, seed);
          const diff = Math.max(0, nx * L[0] + ny * L[1] + nz * L[2]);
          const spec = Math.pow(Math.max(0, nx * H[0] + ny * H[1] + nz * H[2]), 60);
          const tw = 0.5 + 0.5 * Math.sin(t * 1.6 + rnd * 40);
          let v = 0.42 + 0.38 * diff + 0.2 * (rnd - 0.5) + 0.08 * tw + spec * 0.6;
          v = Math.min(1, v * (0.55 + 0.45 * Math.sqrt(nz)));
          const rose = rnd > 0.85 ? 0.35 : 0;
          const s = dark ? 0.55 : 1;
          const r = Math.round((150 + 105 * v) * s), gg = Math.round((120 + 130 * v - rose * 60) * s), bb = Math.round((130 + 122 * v - rose * 40) * s);
          const a = P(la0 + dLa, lo0 + dLo), b2 = P(la0 + dLa, lo1 - dLo), c2 = P(la1 - dLa, lo1 - dLo), d = P(la1 - dLa, lo0 + dLo);
          ctx.fillStyle = `rgb(${r},${gg},${bb})`;
          ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b2); ctx.lineTo(...c2); ctx.lineTo(...d); ctx.closePath(); ctx.fill();
          if (!reduceMotion && (spec > 0.55 || (rnd > 0.975 && tw > 0.85 && nz > 0.3))) glints.push([...P(lac, loc), Math.max(spec, tw * 0.7)]);
        }
      }
      const rim = ctx.createRadialGradient(cx, cy, R * 0.7, cx, cy, R);
      rim.addColorStop(0, 'rgba(255,255,255,0)'); rim.addColorStop(1, dark ? 'rgba(255,255,255,0.12)' : 'rgba(255,255,255,0.35)');
      ctx.fillStyle = rim; ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.fill();
      glints.forEach(([x, y, s]) => {
        const len = (6 + 10 * s) * dpr;
        ctx.strokeStyle = `rgba(255,255,255,${0.5 + 0.5 * s})`; ctx.lineWidth = 1.2 * dpr;
        ctx.beginPath(); ctx.moveTo(x - len, y); ctx.lineTo(x + len, y); ctx.moveTo(x, y - len); ctx.lineTo(x, y + len); ctx.stroke();
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, 1.6 * dpr, 0, Math.PI * 2); ctx.fill();
      });
    }

    const t0 = performance.now();
    const frame = (now) => {
      const t = reduceMotion ? 0 : (now - t0) / 1000;
      canvases.forEach((c, i) => { if (reduceMotion || visible.has(c)) draw(c, t * 0.12 + i * 0.9, i, t); });
      if (!reduceMotion) discoRaf = requestAnimationFrame(frame);
    };
    canvases.forEach((c, i) => draw(c, i * 0.9, i, 0));
    discoRaf = requestAnimationFrame(frame);
    if (reduceMotion) {
      addEventListener('resize', () => canvases.forEach((c, i) => draw(c, i * 0.9, i, 0)));
      new MutationObserver(() => canvases.forEach((c, i) => draw(c, i * 0.9, i, 0))).observe(root, { attributes: true, attributeFilter: ['data-dark'] });
    }
  }

  // ---------- Systems map ----------
  const NS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs = {}, parent) => {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  };
  function buildMap(platforms) {
    const svg = $('#systemsMap');
    svg.innerHTML = '';
    const cx = 220, cy = 200, rx = 160, ry = 138, R = 38;
    const pos = {};
    platforms.forEach((p, i) => {
      const a = (-90 + i * (360 / platforms.length)) * Math.PI / 180;
      pos[p.id] = { x: cx + rx * Math.cos(a), y: cy + ry * Math.sin(a) };
    });

    const gEdges = el('g', {}, svg), gPackets = el('g', {}, svg), gNodes = el('g', {}, svg);
    const edges = [];
    const addEdge = (a, b, ax, ay, bx, by, spoke) => {
      const line = el('line', { x1: ax, y1: ay, x2: bx, y2: by, class: 'edge' + (spoke ? ' spoke' : '') }, gEdges);
      edges.push({ a, b, ax, ay, bx, by, line, spoke });
    };
    platforms.forEach((p) => addEdge('hub', p.id, cx, cy, pos[p.id].x, pos[p.id].y, true));
    const seen = new Set();
    platforms.forEach((p) => p.connectsTo.forEach((q) => {
      const key = [p.id, q].sort().join('|');
      if (seen.has(key) || !pos[q]) return;
      seen.add(key);
      addEdge(p.id, q, pos[p.id].x, pos[p.id].y, pos[q].x, pos[q].y, false);
    }));

    // Hub: Lydia's photo at the center of the systems she connects
    const HR = 50;
    const hub = el('g', { class: 'hub' }, gNodes);
    const defs = el('defs', {}, svg);
    const clip = el('clipPath', { id: 'hubClip' }, defs);
    el('circle', { cx, cy, r: HR }, clip);
    el('circle', { cx, cy, r: HR, class: 'ring' }, hub);
    el('circle', { cx, cy, r: HR }, hub);
    const img = el('image', { x: cx - HR, y: cy - HR, width: HR * 2, height: HR * 2, 'clip-path': 'url(#hubClip)', preserveAspectRatio: 'xMidYMid slice' }, hub);
    img.setAttribute('href', DATA.profile.photo.thumb);
    el('title', {}, hub).textContent = DATA.profile.name;
    el('circle', { cx, cy, r: HR - 2, class: 'photo-ring' }, hub);
    el('circle', { cx, cy, r: HR + 1, class: 'photo-edge' }, hub);

    const nodes = {};
    platforms.forEach((p) => {
      const g = el('g', { class: 'node' }, gNodes);
      el('circle', { cx: pos[p.id].x, cy: pos[p.id].y, r: R }, g);
      el('text', { x: pos[p.id].x, y: pos[p.id].y + 4.5 }, g).textContent = p.name;
      el('title', {}, g).textContent = `${p.name}: ${p.blurb}`;
      nodes[p.id] = g;
      g.addEventListener('pointerenter', () => highlight(p.id));
    });
    svg.addEventListener('pointerleave', () => highlight(null));

    function highlight(id) {
      const linked = new Set(id ? [id] : []);
      edges.forEach((ed) => {
        const on = id && (ed.a === id || ed.b === id);
        ed.line.classList.toggle('on', !!on);
        if (on) { linked.add(ed.a); linked.add(ed.b); }
      });
      for (const k in nodes) {
        nodes[k].classList.toggle('on', k === id);
        nodes[k].classList.toggle('dim', !!id && !linked.has(k));
      }
    }

    // Data packets moving along the lines
    if (!reduceMotion) {
      const packets = Array.from({ length: 9 }, () => ({ dot: el('circle', { r: 3, class: 'packet' }, gPackets), e: null, t: 0, v: 0 }));
      const pick = (pk) => {
        pk.e = edges[Math.floor(Math.random() * edges.length)];
        pk.t = 0; pk.v = 0.004 + Math.random() * 0.006; pk.rev = Math.random() < 0.5;
      };
      packets.forEach((pk) => { pick(pk); pk.t = Math.random(); });
      let last = performance.now();
      const tick = (now) => {
        const dt = Math.min(50, now - last) / 16.7; last = now;
        packets.forEach((pk) => {
          pk.t += pk.v * dt;
          if (pk.t >= 1) pick(pk);
          const t = pk.rev ? 1 - pk.t : pk.t;
          const ed = pk.e;
          pk.dot.setAttribute('cx', ed.ax + (ed.bx - ed.ax) * t);
          pk.dot.setAttribute('cy', ed.ay + (ed.by - ed.ay) * t);
          pk.dot.setAttribute('opacity', Math.sin(pk.t * Math.PI).toFixed(2));
        });
        requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    }
  }

  // ---------- Boot ----------
  async function boot() {
    try {
      DATA = PREBUILT || (await gql(PAGE_QUERY)).data;
      render(DATA);
      sizeVars();
    } catch (err) {
      console.error(`Could not load content: ${err.message}. Is the Python server running?`);
    }
  }
  boot();
})();
</script>
</body>
</html>
