<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>{{title}} | Lydia Cortez</title>
<meta name="description" content="{{title}}: a project by Lydia Cortez. Coming soon.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23660019'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='18' fill='white' text-anchor='middle'%3EL%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
{{styles}}
</head>
<body>
<nav class="nav">
  <a href="/" class="nav-logo">{{name}}</a>
  <div class="nav-right">
    <ul class="nav-links" id="navLinks">
      <li><a href="/#about">About</a></li>
      <li><a href="/#expertise">Expertise</a></li>
      <li><a href="/#projects">Projects</a></li>
      <li><a href="/#recommendations">Recommendations</a></li>
      <li><a href="/#contact">Contact</a></li>
    </ul>
    <button class="icon-btn" id="themeToggle" type="button" aria-label="Switch color theme">
      <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <button class="icon-btn nav-toggle" id="navToggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="navLinks"><span></span></button>
  </div>
</nav>

<main>
  <section class="project-page">
    <div class="section-head"><div class="section-label">Projects</div></div>
    <h1 class="project-title">{{title}}<br><em>coming soon.</em></h1>
    <p class="project-note">The full write-up for this project is on its way.</p>
    <a class="btn btn-ghost" href="/#projects"><span aria-hidden="true">&larr;</span> Back to projects</a>
  </section>
</main>

<footer class="footer">
  <p>{{footer_credit}} <a href="{{footer_source_url}}" target="_blank" rel="noopener">{{footer_source_label}}</a></p>
  <p>{{footer_legal}}</p>
</footer>
{{script}}
</body>
</html>
