<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Lydia Cortez Portfolio</title>
<meta name="description" content="Lydia Cortez: business and technical operations, systems strategy, and operations leadership.">
<link rel="icon" type="image/png" sizes="32x32" href="/static/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/static/img/favicon-192.png">
<link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Lydia Cortez">
<meta property="og:title" content="Lydia Cortez Portfolio">
<meta property="og:description" content="Lydia Cortez: business and technical operations, systems strategy, and operations leadership.">
<meta property="og:url" content="https://lylyco.github.io/">
<meta property="og:image" content="https://lylyco.github.io/static/img/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="LydiaCo, Los Angeles">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<!--APP-->
<nav class="nav">
  <a href="#top" class="nav-logo" data-bind="name">Lydia Cortez</a>
  <div class="nav-right">
    <ul class="nav-links" id="navLinks">
      <li><a href="#about">About</a></li>
      <li><a href="#expertise">Expertise</a></li>
      <li><a href="#projects">Projects</a></li>
      <li><a href="#recommendations">Recommendations</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
    <button class="icon-btn" id="themeToggle" type="button" aria-label="Switch color theme">
      <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <button class="icon-btn nav-toggle" id="navToggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="navLinks"><span></span></button>
  </div>
</nav>

<main>
  <section class="hero">
    <div class="hero-copy">
      <h1><span data-bind="headlineLead">Clarity</span><br><em data-bind="headlineEmphasis">from Complexity</em></h1>
      <p class="hero-summary" data-bind="summary"></p>
      <p class="hero-industries" data-bind="industriesLine"></p>
      <ul class="tags" id="tags"></ul>
      <div class="cta-row" id="heroCta"></div>
    </div>

    <figure class="map">
      <div class="map-head">
        <span class="label">Systems I've operated</span>
      </div>
      <svg id="systemsMap" viewBox="0 0 440 400" role="img" aria-label="Map of platforms Lydia has worked across and how they connect"></svg>
    </figure>
  </section>

  <section class="about" id="about">
    <div class="section-head"><div class="section-label">About</div><nav class="sec-nav" aria-label="Section navigation"><a class="sec-arrow" href="#" data-top aria-label="Back to profile"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4.5"/><path d="m8 14 4-4.5 4 4.5"/></svg></a><a class="sec-arrow" href="#expertise" aria-label="Next: Expertise"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4.5"/><path d="m8 10 4 4.5 4-4.5"/></svg></a></nav></div>
    <h2><span data-bind="aboutTitle"></span> <em data-bind="aboutEmphasis"></em></h2>
    <div class="about-grid">
      <figure class="portrait" id="portrait"></figure>
      <div class="about-main">
        <div class="about-text" id="aboutText"></div>
      </div>
    </div>
  </section>

  <section class="expertise" id="expertise">
    <div class="section-head"><div class="section-label">Expertise</div><nav class="sec-nav" aria-label="Section navigation"><a class="sec-arrow" href="#about" aria-label="Back to About"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4.5"/><path d="m8 14 4-4.5 4 4.5"/></svg></a><a class="sec-arrow" href="#projects" aria-label="Next: Projects"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4.5"/><path d="m8 10 4 4.5 4-4.5"/></svg></a></nav></div>
    <h2>Where I create <em>leverage.</em></h2>
    <div class="expertise-grid" id="expertiseGrid"></div>
  </section>

  <section class="projects" id="projects">
    <div class="section-head"><div class="section-label">Projects</div><nav class="sec-nav" aria-label="Section navigation"><a class="sec-arrow" href="#expertise" aria-label="Back to Expertise"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4.5"/><path d="m8 14 4-4.5 4 4.5"/></svg></a><a class="sec-arrow" href="#recommendations" aria-label="Next: Recommendations"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4.5"/><path d="m8 10 4 4.5 4-4.5"/></svg></a></nav></div>
    <h2><span data-bind="projectsTitle"></span> <em data-bind="projectsEmphasis"></em></h2>
    <div class="expertise-grid" id="projectGrid"></div>
  </section>

  <section class="recommendations" id="recommendations">
    <div class="section-head"><div class="section-label">Recommendations</div><nav class="sec-nav" aria-label="Section navigation"><a class="sec-arrow" href="#projects" aria-label="Back to Projects"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4.5"/><path d="m8 14 4-4.5 4 4.5"/></svg></a><a class="sec-arrow" href="#contact" aria-label="Next: Contact"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4.5"/><path d="m8 10 4 4.5 4-4.5"/></svg></a></nav></div>
    <h2><span data-bind="recTitle"></span> <em data-bind="recEmphasis"></em></h2>
    <div class="rec-grid" id="recGrid"></div>
    <p class="rec-source" id="recSource"></p>
  </section>

  <section class="contact" id="contact">
    <div class="section-head center"><div class="section-label center">Contact</div><nav class="sec-nav" aria-label="Section navigation"><a class="sec-arrow" href="#recommendations" aria-label="Back to Recommendations"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4.5"/><path d="m8 14 4-4.5 4 4.5"/></svg></a></nav></div>
    <h2><span data-bind="contactTitle"></span><br><em data-bind="contactEmphasis"></em></h2>
    <p data-bind="contactBody"></p>
    <div class="cta-row center" id="contactCta"></div>
  </section>
</main>

<footer class="footer"></footer>
<!--/APP-->
<script src="/static/app.js"></script>
</body>
</html>
