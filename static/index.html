<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Lydia Cortez Portfolio</title>
<meta name="description" content="Lydia Cortez: business and technical operations, systems strategy, and operations leadership.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23660019'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='18' fill='white' text-anchor='middle'%3EL%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<!--APP-->
<nav class="nav" id="top">
  <a href="#top" class="nav-logo" data-bind="name">Lydia Cortez</a>
  <div class="nav-right">
    <ul class="nav-links" id="navLinks">
      <li><a href="#about">About</a></li>
      <li><a href="#expertise">Expertise</a></li>
      <li><a href="#stack">Stack</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
    <button class="icon-btn" id="themeToggle" type="button" aria-label="Switch color theme">
      <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <button class="icon-btn nav-toggle" id="navToggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="navLinks"><span></span></button>
  </div>
</nav>

<main>
  <section class="hero">
    <div class="hero-copy">
      <h1><span data-bind="headlineLead">Clarity</span><br><em data-bind="headlineEmphasis">from Complexity</em></h1>
      <p class="hero-summary" data-bind="summary"></p>
      <p class="hero-industries" data-bind="industriesLine"></p>
      <ul class="tags" id="tags"></ul>
      <div class="cta-row" id="heroCta"></div>
    </div>

    <figure class="map" aria-labelledby="mapCaption">
      <div class="map-head">
        <span class="label">Systems I've operated</span>
        <span class="map-hint">Hover or tap a platform</span>
      </div>
      <svg id="systemsMap" viewBox="0 0 440 400" role="img" aria-label="Map of platforms Lydia has worked across and how they connect"></svg>
      <figcaption id="mapCaption" class="map-caption" aria-live="polite">
        <strong>Six platforms, one operator.</strong>
        <span>Each line is an integration I've worked across. Select a platform to see the related expertise.</span>
      </figcaption>
    </figure>
  </section>

  <section class="about" id="about">
    <div class="section-label">About</div>
    <h2><span data-bind="aboutTitle"></span> <em data-bind="aboutEmphasis"></em></h2>
    <div class="about-grid">
      <figure class="portrait" id="portrait"></figure>
      <div class="about-main">
        <div class="about-text" id="aboutText"></div>
      </div>
    </div>
    <ul class="strengths" id="strengths"></ul>
  </section>

  <section class="expertise" id="expertise">
    <div class="section-label">Expertise</div>
    <h2>Where I create <em>leverage.</em></h2>
    <div class="filter" role="group" aria-label="Filter expertise by platform" id="filter"></div>
    <div class="expertise-grid" id="expertiseGrid"></div>
  </section>

  <section class="stack" id="stack">
    <div class="stack-copy">
      <div class="section-label">Under the hood</div>
      <h2>This page is <em>one query.</em></h2>
      <p data-bind="underTheHoodBody"></p>
      <p class="stack-mode" id="stackMode">Loading…</p>
    </div>
    <div class="console">
      <div class="console-tabs" role="tablist">
        <button type="button" role="tab" id="tabQuery" aria-selected="true" aria-controls="consoleBody">Query</button>
        <button type="button" role="tab" id="tabResponse" aria-selected="false" aria-controls="consoleBody">Response</button>
        <span class="console-meta" id="consoleMeta"></span>
      </div>
      <pre class="console-body" id="consoleBody" tabindex="0"></pre>
    </div>
  </section>

  <section class="contact" id="contact">
    <div class="section-label center">Contact</div>
    <h2><span data-bind="contactTitle"></span><br><em data-bind="contactEmphasis"></em></h2>
    <p data-bind="contactBody"></p>
    <div class="cta-row center" id="contactCta"></div>
  </section>
</main>

<footer class="footer" data-bind="footer"></footer>
<!--/APP-->
<script src="/static/app.js"></script>
</body>
</html>
